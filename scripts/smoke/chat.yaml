# Release smoke (DoD rule 7): one REAL signed-in chat against production.
# Build 38 shipped with chat answering 502 — the tab walk alone cannot see
# that. Credentials arrive as Maestro env (-e SMOKE_EMAIL / -e SMOKE_PASSWORD,
# read from the vault by smoke-release.sh); nothing is stored in the repo.
appId: io.bamware.brewdesk
---
# The tab walk ends with a café detail open; close it so the tab bar is reachable.
- runFlow:
    when:
      visible:
        id: "detail-close"
    commands:
      - tapOn:
          id: "detail-close"
- tapOn: "You"
- tapOn:
    id: "account-entry"
# The simulator keychain survives a reinstall, so the test account may still
# be signed in from the last run: sign in only when the sign-in sheet shows.
- runFlow:
    when:
      visible:
        id: "account-sign-in-email"
    commands:
      - tapOn:
          id: "account-sign-in-email"
      - tapOn:
          id: "account-sign-in-email-field"
      - inputText: ${SMOKE_EMAIL}
      - pressKey: Enter
      # The keyboard covers the lower half of the form and the fields have no
      # focus chaining (bamware-ios#14), so scroll each one into view.
      - scrollUntilVisible:
          element:
            id: "account-sign-in-password-field"
          direction: DOWN
      - tapOn:
          id: "account-sign-in-password-field"
      - inputText: ${SMOKE_PASSWORD}
      - pressKey: Enter
      - scrollUntilVisible:
          element:
            id: "account-sign-in-submit"
          direction: DOWN
      - tapOn:
          id: "account-sign-in-submit"
      - extendedWaitUntil:
          notVisible:
            id: "account-sign-in-busy-overlay"
          timeout: 30000
- runFlow:
    when:
      visible: "Sign Out"
    commands:
      - tapOn: "Close"
- tapOn: "Ask"
- tapOn:
    id: "ask-input"
- inputText: "Quiet with outlets near me"
- tapOn:
    id: "ask-send"
- extendedWaitUntil:
    visible:
      id: "ask-reply"
    timeout: 90000
- takeScreenshot: ${OUT}/06-chat-reply
