name: Reviewer simulation

# Replays App Review's first ten minutes (BrewDeskUITests/ReviewerSimulationTests)
# in Release on an iPhone and in iPad compatibility, then uploads the xcresult
# bundles plus every step screenshot as a downloadable evidence archive.
#
# Cost: this repo is private, so macOS minutes bill at 10x. A run is ~15-20
# wall-clock minutes. Quota bit on 2026-08-21 — per Bilal's approval the
# trigger is now main + nightly + manual (not per-PR); PR-level coverage
# comes from ci.yml, and QA runs this suite locally when a diff warrants it.

on:
  schedule:
    - cron: "0 7 * * *"   # nightly ~03:00 New York
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: brewdesk-reviewer-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TEST_ID: BrewDeskUITests/ReviewerSimulationTests

jobs:
  reviewer-sim:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      # Same sibling layout as ci.yml: the development workspace references
      # ../bamware-ios, so the project must sit next to that checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          path: bamware-brewdesk

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: mrbam88/bamware-ios
          path: bamware-ios

      - name: Select Xcode 26.5
        run: sudo xcode-select --switch /Applications/Xcode_26.5.app

      - name: Reviewer simulation — iPhone (Release)
        working-directory: bamware-brewdesk
        run: |
          xcodebuild -project BrewDesk.xcodeproj -scheme BrewDesk \
            -configuration Release ENABLE_TESTABILITY=YES \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro Max' \
            -only-testing:"$TEST_ID" \
            -resultBundlePath "$RUNNER_TEMP/reviewer-sim-iphone.xcresult" \
            test

      - name: Reviewer simulation — iPad compatibility (Release)
        if: ${{ !cancelled() }}
        working-directory: bamware-brewdesk
        run: |
          xcodebuild -project BrewDesk.xcodeproj -scheme BrewDesk \
            -configuration Release ENABLE_TESTABILITY=YES \
            -destination 'platform=iOS Simulator,name=iPad Pro 13-inch (M5)' \
            -only-testing:"$TEST_ID" \
            -resultBundlePath "$RUNNER_TEMP/reviewer-sim-ipad.xcresult" \
            test

      - name: Collect evidence archive
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/evidence"
          mkdir -p "$OUT/screenshots"
          for device in iphone ipad; do
            bundle="$RUNNER_TEMP/reviewer-sim-$device.xcresult"
            [ -d "$bundle" ] || continue
            xcrun xcresulttool export attachments \
              --path "$bundle" --output-path "$OUT/screenshots/$device"
            (cd "$RUNNER_TEMP" && zip -qr "$OUT/reviewer-sim-$device.xcresult.zip" "reviewer-sim-$device.xcresult")
          done
          find "$OUT" -type f | sort

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: reviewer-simulation-evidence
          path: ${{ runner.temp }}/evidence
          retention-days: 14
          if-no-files-found: error
